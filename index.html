<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{--t:#1fd1c4;--k:#070b0c;--g:#d4af37;--s:#c0c6cc}*{box-sizing:border-box}
body{margin:0;background:var(--k);color:var(--s);font:16px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:10px 16px;background:#000d;backdrop-filter:blur(6px);border-bottom:1px solid var(--t)}
header b{color:var(--t);font-size:1.4rem;margin-right:auto}header a{color:var(--s);text-decoration:none}header a:hover{color:var(--g)}
.bn{width:100%;height:clamp(120px,24vw,260px);object-fit:cover;display:block;background:#0f1a1b}
section{max-width:1100px;margin:auto;padding:24px 16px}h1{color:var(--t);font-size:clamp(2rem,6vw,3.2rem);margin:.2em 0}h2{color:var(--g);border-bottom:1px solid #1d3b3a;padding-bottom:6px}h3{color:var(--t);margin-bottom:0}
button{background:var(--g);color:#000;border:0;border-radius:6px;padding:7px 14px;font-weight:700;cursor:pointer}a{color:var(--t)}
.cols{display:flex;gap:60px;position:relative;overflow-x:auto;padding:12px 4px}.cols.wrap{flex-wrap:wrap;gap:16px}.col{display:flex;flex-direction:column;gap:24px;justify-content:center}
.card{width:160px;background:#0f1a1b;border:1px solid #1d3b3a;border-radius:8px;overflow:hidden;cursor:pointer;flex:none}.card:hover{border-color:var(--g)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#123;display:block}.card p{margin:6px 8px;font-size:.85rem}
svg.ar{position:absolute;left:0;top:0;pointer-events:none}
.bar{height:8px;background:#1d3b3a;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--t),var(--g))}
.row{display:flex;gap:12px;align-items:center;margin:10px 0}.row img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#123}.row div{flex:1}
.n{color:var(--g);font-weight:800;min-width:2ch}.note{border:1px solid var(--g);color:var(--g);border-radius:8px;padding:10px;font-size:.9rem}
.av{width:110px;height:110px;border-radius:50%;border:3px solid var(--g);object-fit:cover;background:#123;flex:none}.who{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.who p{margin:0;flex:1;min-width:220px}
.pill{display:inline-block;margin:0 10px 10px 0;padding:10px 20px;border:1px solid var(--t);border-radius:999px;color:var(--s);text-decoration:none;font-weight:700}.pill:hover{background:var(--t);color:#000}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.pc{background:#0f1a1b;border:1px solid #1d3b3a;border-radius:10px;overflow:hidden}.pc img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#123}.pc .i{padding:10px 12px}
.sub{color:var(--s);font-size:1.3rem;margin:28px 0 0;border-left:4px solid var(--g);padding-left:10px}h4{color:var(--t);margin:18px 0 0;font-size:1.15rem}[id]{scroll-margin-top:64px}footer{text-align:center;padding:24px;font-size:.85rem}
#m{position:fixed;inset:0;background:#000e;display:none;overflow:auto;padding:16px;z-index:9}#m video{width:100%;max-width:900px;display:block;margin:auto;background:#000}.b{max-width:900px;margin:10px auto}.links a{margin-right:16px;display:inline-block}</style></head><body><div id="app"></div><div id="m"></div><script>const ALL={"es":{"name":"Animark","tag":"Obras adaptadas a anime con IA.","about":"Escribe aquí quién eres.","avatar":"img/perfil.jpg","banner":"img/banner.jpg","footer":"","ui":{"nSeries":"Proyectos","nDone":"Finalizados","nDev":"En desarrollo","nNext":"Próximas posibles obras","nPoll":"Encuesta","nContact":"Contacto","nextNote":"La probabilidad puede cambiar con el tiempo.","pollNote":"Tomo la encuesta solo como sugerencia: estar en 1er puesto no significa que la adapte pronto.","vote":"Votar (hasta 3 obras)","dl":"Descargar video"},"series":[{"title":"Proyecto de ejemplo","desc":"Descripción de la obra.","mode":"graph","status":"dev","eps":[{"id":"c1","title":"Capítulo 1","video":"https://archive.org/details/PEGA-AQUI-EL-ENLACE","thumb":"img/obra1/c1.jpg","next":["c2a","c2b"]},{"id":"c2a","title":"Capítulo 2A","video":"https://archive.org/details/PEGA-AQUI-EL-ENLACE","thumb":"img/obra1/c2a.jpg","next":["c3"]},{"id":"c2b","title":"Capítulo 2B","video":"https://archive.org/details/PEGA-AQUI-EL-ENLACE","thumb":"img/obra1/c2b.jpg","next":["c3"]},{"id":"c3","title":"Capítulo 3","video":"https://archive.org/details/PEGA-AQUI-EL-ENLACE","thumb":"img/obra1/c3.jpg","next":[]}]}],"upcoming":[{"name":"Proyecto 1","img":"img/proximas/p1.jpg","prob":60},{"name":"Proyecto 2","img":"img/proximas/p2.jpg","prob":25}],"poll":{"show":true,"url":"https://forms.gle/TU_ENLACE","options":[{"name":"Obra A","votes":12},{"name":"Obra B","votes":7}]},"contact":[{"label":"Telegram","url":"https://t.me/tuusuario"},{"label":"Correo","url":"mailto:tu@correo.com"},{"label":"YouTube","url":"https://youtube.com/@tucanal"},{"label":"Facebook","url":"https://facebook.com/tupagina"}]},"en":{"name":"Animark","tag":"Works adapted to anime with AI.","about":"Write here about yourself.","avatar":"img/perfil.jpg","banner":"img/banner.jpg","footer":"","ui":{"nSeries":"Projects","nDone":"Completed","nDev":"In development","nNext":"Possible upcoming works","nPoll":"Poll","nContact":"Contact","nextNote":"Probabilities may change over time.","pollNote":"I take this poll only as a suggestion: being in 1st place does not mean I will adapt it soon.","vote":"Vote (up to 3 works)","dl":"Download video"},"series":[{"title":"Sample project","desc":"Work description.","mode":"graph","status":"dev","eps":[{"id":"c1","title":"Chapter 1","video":"https://archive.org/details/PEGA-AQUI-EL-ENLACE","thumb":"img/obra1/c1.jpg","next":["c2a","c2b"]},{"id":"c2a","title":"Chapter 2A","video":"https://archive.org/details/PEGA-AQUI-EL-ENLACE","thumb":"img/obra1/c2a.jpg","next":["c3"]},{"id":"c2b","title":"Chapter 2B","video":"https://archive.org/details/PEGA-AQUI-EL-ENLACE","thumb":"img/obra1/c2b.jpg","next":["c3"]},{"id":"c3","title":"Chapter 3","video":"https://archive.org/details/PEGA-AQUI-EL-ENLACE","thumb":"img/obra1/c3.jpg","next":[]}]}],"upcoming":[{"name":"Project 1","img":"img/proximas/p1.jpg","prob":60},{"name":"Project 2","img":"img/proximas/p2.jpg","prob":25}],"poll":{"show":true,"url":"https://forms.gle/TU_ENLACE","options":[{"name":"Obra A","votes":12},{"name":"Obra B","votes":7}]},"contact":[{"label":"Telegram","url":"https://t.me/tuusuario"},{"label":"Email","url":"mailto:tu@correo.com"},{"label":"YouTube","url":"https://youtube.com/@tucanal"},{"label":"Facebook","url":"https://facebook.com/tupagina"}]},"theme":{"turquesa":"#1fd1c4","dorado":"#d4af37","plateado":"#c0c6cc","fondo":"#070b0c"}};(function runtime(){
let L;try{L=localStorage.getItem('lang')}catch(x){}
L=L||((navigator.language||'').toLowerCase().startsWith('es')?'es':'en');
const $=s=>document.querySelector(s),e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
let D;
const u=k=>e(D.ui[k]),card=(p,i,j)=>`<div class=card data-id="${e(p.id)}" data-v="${i},${j}"><img src="${e(p.thumb)}" alt=""><p>${e(p.title)}</p></div>`;
function cols(s,i){
 if(s.mode!=='graph')return `<div class="cols wrap">${s.eps.map((p,j)=>card(p,i,j)).join('')}</div>`;
 const d={};s.eps.forEach(p=>d[p.id]=0);
 for(let r=0;r<s.eps.length;r++)s.eps.forEach(p=>(p.next||[]).forEach(n=>{if(n in d)d[n]=Math.max(d[n],d[p.id]+1)}));
 const g=[];s.eps.forEach((p,j)=>(g[d[p.id]]=g[d[p.id]]||[]).push(card(p,i,j)));
 return `<div class=cols data-g=1>${g.filter(Boolean).map(c=>`<div class=col>${c.join('')}</div>`).join('')}</div>`}
function draw(){
 D=ALL[L];const th=ALL.theme||{};[['t','turquesa'],['g','dorado'],['s','plateado'],['k','fondo']].forEach(([a,b])=>th[b]&&document.documentElement.style.setProperty('--'+a,th[b]));document.documentElement.lang=L;document.title=D.name;
 const up=[...D.upcoming].filter(p=>p.name).sort((a,b)=>b.prob-a.prob),po=[...D.poll.options].filter(p=>p.name).sort((a,b)=>b.votes-a.votes);
 $('#app').innerHTML=`<header><b>${e(D.name)}</b><a href="#s">${u('nSeries')}</a><a href="#n">${u('nNext')}</a>${D.poll.show?`<a href="#p">${u('nPoll')}</a>`:''}<a href="#c">${u('nContact')}</a><button id=lg>${L=='es'?'English':'Español'}</button></header>
<img class=bn src="${e(D.banner)}" alt=""><section><h1>${e(D.name)}</h1><p>${e(D.tag)}</p></section>
<section id=s><h2>${u('nSeries')}</h2>${['done','dev'].map(st=>{const l=D.series.map((s,i)=>[s,i]).filter(([s])=>(s.status||'done')==st);return l.length?`<h3 class=sub>${u(st=='done'?'nDone':'nDev')}</h3>`+l.map(([s,i])=>`<h4>${e(s.title)}</h4><p>${e(s.desc)}</p>${cols(s,i)}`).join(''):''}).join('')}</section>
<section id=n><h2>${u('nNext')}</h2><p>${u('nextNote')}</p><div class=grid>${up.map(p=>`<div class=pc><img src="${e(p.img)}" alt=""><div class=i><b>${e(p.name)}</b><div class=bar><i style="width:${+p.prob||0}%"></i></div><span class=n>${+p.prob||0}%</span></div></div>`).join('')}</div></section>
${D.poll.show?`<section id=p><h2>${u('nPoll')}</h2><p class=note>${u('pollNote')}</p>${po.map((p,i)=>`<div class=row><span class=n>${i+1}</span><div><b>${e(p.name)}</b><div class=bar><i style="width:${po[0].votes?p.votes/po[0].votes*100:0}%"></i></div></div><span>${+p.votes||0}</span></div>`).join('')}${D.poll.url?`<p><a href="${e(D.poll.url)}" target=_blank rel=noopener><button>${u('vote')}</button></a></p>`:''}</section>`:''}
<section id=c><h2>${u('nContact')}</h2><div class=who><img class=av src="${e(D.avatar)}" alt=""><p>${e(D.about)}</p></div><p style="margin-top:18px">${D.contact.filter(c=>c.url).map(c=>`<a class=pill href="${e(c.url)}" target=_blank rel=noopener>${e(c.label)}</a>`).join('')}</p></section>${D.footer?`<footer>${e(D.footer)}</footer>`:''}`;
 $('#lg').onclick=()=>{L=L=='es'?'en':'es';try{localStorage.setItem('lang',L)}catch(x){}draw()};
 document.querySelectorAll('a[href^="#"]').forEach(a=>a.onclick=ev=>{ev.preventDefault();const t=$(a.getAttribute('href'));t&&t.scrollIntoView({behavior:'smooth'})});
 document.querySelectorAll('.card[data-v]').forEach(c=>c.onclick=()=>{const[i,j]=c.dataset.v.split(',');play(D.series[i].eps[j])});
 arrows()}
function arrows(){document.querySelectorAll('.cols[data-g]').forEach(c=>{
 const R=c.getBoundingClientRect(),cs=[...c.querySelectorAll('.card')];let p='';
 cs.forEach(a=>{const [i,j]=a.dataset.v.split(',');(D.series[i].eps[j].next||[]).forEach(n=>{const b=cs.find(z=>z.dataset.id==n);if(!b)return;
  const A=a.getBoundingClientRect(),B=b.getBoundingClientRect(),x1=A.right-R.left+c.scrollLeft,y1=A.top+A.height/2-R.top,x2=B.left-R.left+c.scrollLeft-4,y2=B.top+B.height/2-R.top,m=(x1+x2)/2;
  p+=`<path d="M${x1} ${y1}C${m} ${y1} ${m} ${y2} ${x2} ${y2}" fill=none stroke=#1fd1c4 stroke-width=2 marker-end=url(#h) />`})});
 c.querySelector('svg')?.remove();c.insertAdjacentHTML('beforeend',`<svg class=ar width=${c.scrollWidth} height=${c.scrollHeight}><defs><marker id=h markerWidth=8 markerHeight=8 refX=6 refY=4 orient=auto><path d="M0 0L8 4L0 8z" fill=#d4af37 /></marker></defs>${p}</svg>`)})}
function play(p){
 const m=(p.video||'').match(/archive\.org\/(?:details|embed)\/([^\/?#]+)/),
 v=m?`<iframe src="https://archive.org/embed/${e(m[1])}" allowfullscreen style="width:100%;max-width:900px;aspect-ratio:16/9;border:0;display:block;margin:auto"></iframe>`:`<video controls autoplay src="${e(p.video)}" poster="${e(p.thumb)}"></video>`,
 dl=m?'https://archive.org/details/'+m[1]:p.video;
 $('#m').innerHTML=`<div class=b><button id=cl>✕</button></div>${v}<div class=b><h3>${e(p.title)}</h3><p class=links><a href="${e(dl)}" target=_blank rel=noopener>⬇ ${u('dl')}</a></p></div>`;
 $('#m').style.display='block';$('#cl').onclick=()=>{$('#m').innerHTML='';$('#m').style.display='none'}}
addEventListener('resize',arrows);draw()})()</script></body></html>
